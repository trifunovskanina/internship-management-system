<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('My Profile')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container container-centered">
    <div class="card card-profile">

        <div class="profile-header">
            <h2 th:text="${profile.firstName + ' ' + profile.lastName}"></h2>
            <span>User Profile</span>
        </div>

        <div class="profile-section">
            <h3>Account Information</h3>

            <div class="profile-row">
                <span class="profile-label">Email</span>
                <span th:text="${profile.email} ?: '—'"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">Status</span>
                <span class="badge badge-pill"
                      th:classappend="${profile.enabled} ? 'badge-active' : 'badge-inactive'"
                      th:text="${profile.enabled} ? 'Active' : 'Disabled'"></span>
            </div>
        </div>

        <div class="profile-section" th:if="${profile.indexNumber != null}">
            <h3>Student Details</h3>

            <div class="profile-row">
                <span class="profile-label">Index Number</span>
                <span th:text="${profile.indexNumber}"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">GPA</span>
                <span th:text="${#numbers.formatDecimal(profile.gpa, 1, 2)}"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">Study Program</span>
                <span th:text="${profile.studyProgram}"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">Faculty</span>
                <span th:text="${profile.faculty}"></span>
            </div>
        </div>

        <div class="profile-section" th:if="${profile.department != null}">
            <h3>Mentor Details</h3>

            <div class="profile-row">
                <span class="profile-label">Company</span>
                <span th:text="${profile.company}"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">Department</span>
                <span th:text="${profile.department}"></span>
            </div>

            <div class="profile-row">
                <span class="profile-label">Supervised Internships</span>
                <span th:text="${profile.owningInternships}"></span>
            </div>
        </div>

    </div>
</div>

</body>
</html>

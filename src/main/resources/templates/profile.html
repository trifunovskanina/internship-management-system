<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>My Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f7fb;
      color: #333;
      margin: 0;
    }

    .navbar {
      background-color: #3f51b5;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .navbar .brand {
      font-size: 20px;
      font-weight: 600;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      margin-left: 24px;
      font-weight: 500;
    }

    .container {
      padding: 40px 60px;
      display: flex;
      justify-content: center;
    }

    .profile-card {
      background: white;
      width: 100%;
      max-width: 600px;
      padding: 32px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .profile-header {
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 16px;
    }

    .profile-header h2 {
      margin: 0;
    }

    .profile-header span {
      color: #666;
      font-size: 14px;
    }

    .profile-section {
      margin-bottom: 24px;
    }

    .profile-section h3 {
      margin-bottom: 12px;
      color: #3f51b5;
      font-size: 16px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .profile-row span {
      color: #555;
    }

    .label {
      font-weight: 600;
      color: #333;
    }

    .status {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .enabled {
      background-color: #e6f4ea;
      color: #137333;
    }

    .disabled {
      background-color: #fce8e6;
      color: #a50e0e;
    }

    .navbar .nav-link-button {
      background: none;
      border: none;
      color: #fff;
      margin-left: 24px;
      font-weight: 500;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }
  </style>

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
  <div class="profile-card">

    <div class="profile-header">
      <h2 th:text="${profile.firstName + ' ' + profile.lastName}"></h2>
      <span>User Profile</span>
    </div>

    <div class="profile-section">
      <h3>Account Information</h3>

      <div class="profile-row">
        <span class="label">Email</span>
        <span th:text="${profile.email} ?: '—'"></span>
      </div>

      <div class="profile-row">
        <span class="label">Status</span>
        <span class="status"
              th:classappend="${profile.enabled} ? 'enabled' : 'disabled'"
              th:text="${profile.enabled} ? 'Active' : 'Disabled'">
        </span>
      </div>
    </div>

    <div class="profile-section" th:if="${profile.indexNumber != null}">
      <h3>Student Details</h3>

      <div class="profile-row">
        <span class="label">Index Number</span>
        <span th:text="${profile.indexNumber}"></span>
      </div>

      <div class="profile-row">
        <span class="label">GPA</span>
        <span th:text="${#numbers.formatDecimal(profile.gpa, 1, 2)}"></span>
      </div>

      <div class="profile-row">
        <span class="label">Study Program</span>
        <span th:text="${profile.studyProgram}"></span>
      </div>

      <div class="profile-row">
        <span class="label">Faculty</span>
        <span th:text="${profile.faculty}"></span>
      </div>
    </div>

    <div class="profile-section" th:if="${profile.department != null}">
      <h3>Mentor Details</h3>

      <div class="profile-row">
        <span class="label">Company</span>
        <span th:text="${profile.company}"></span>
      </div>

      <div class="profile-row">
        <span class="label">Department</span>
        <span th:text="${profile.department}"></span>
      </div>

      <div class="profile-row">
        <span class="label">Supervised Internships</span>
        <span th:text="${profile.owningInternships}"></span>
      </div>
    </div>

  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Internship Management System')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Current Internships</h1>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Duration</th>
                <th sec:authorize="hasRole('STUDENT')"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="internship : ${internships}">
                <td>
                    <a sec:authorize="hasRole('COMPANY_MENTOR')"
                       class="table-link"
                       th:href="@{/company-mentor/internships/{id}/applications(id=${internship.id})}"
                       th:text="${internship.title}"></a>

                    <span sec:authorize="hasRole('STUDENT')"
                          th:text="${internship.title}"></span>
                </td>
                <td th:text="${internship.description}"></td>
                <td class="duration">
                    <span th:text="${internship.durationWeeks}"></span> weeks
                </td>
                <td sec:authorize="hasRole('STUDENT')">
                    <a class="btn btn-primary btn-sm"
                       th:href="@{/student/internships/{id}(id=${internship.id})}">APPLY</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

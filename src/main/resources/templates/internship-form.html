<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Apply for Internship</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f7fb;
      margin: 0;
    }

    .container {
      padding: 40px 60px;
      display: flex;
      flex-direction: column;
      align-items: start;
      justify-content: start;
    }

    .navbar {
      background-color: #3f51b5;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .navbar .brand {
      font-size: 20px;
      font-weight: 600;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      margin-left: 24px;
      font-weight: 500;
    }

    .card {
      background: white;
      max-width: 500px;
      margin: 5% auto 60px auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 20px;
    }

    .label {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }

    button {
      background-color: #3f51b5;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background-color: #2f3fa3;
    }

    .cancel {
      margin-left: 15px;
      text-decoration: none;
      color: #555;
    }

    .file-input-wrapper {
      margin-bottom: 20px;
      display: flex;
    }

    .file-input-wrapper label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }

    .custom-file-input {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .custom-file-input input[type="file"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-input-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      background-color: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      color: #333;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .file-input-button:hover {
      background-color: #e8e9ea;
      border-color: #3f51b5;
    }

    .file-input-button::before {
      content: "📎";
      font-size: 18px;
    }

    .file-name {
      display: inline-block;
      margin-left: 12px;
      color: #666;
      font-size: 14px;
      font-style: italic;
    }

    .file-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .file-input-wrapper {
      display: flex;
      flex-direction: column;
    }

    .navbar .nav-link-button {
      background: none;
      border: none;
      color: #fff;
      margin-left: 24px;
      font-weight: 500;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }
  </style>

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="card container">

  <h1 th:text="${internship.title}"></h1>

  <div class="section">
    <span class="label">Description</span>
    <p th:text="${internship.description}"></p>
  </div>

  <div class="section">
    <span class="label">Company</span>
    <p th:text="${internship.company.name}"></p>
  </div>

  <div class="section">
    <span class="label">Duration</span>
    <p>
      <span th:text="${internship.durationWeeks}"></span> weeks
    </p>
  </div>

  <div class="section">
    <span class="label">Supporting Documents</span>

    <form th:action="@{/student/internships/{id}(id=${internship.id})}"
          method="post"
          enctype="multipart/form-data">

      <div class="file-grid">
        <div class="file-input-wrapper">
          <label>CV (PDF):</label>
          <div class="custom-file-input">
            <input required type="file" name="cvFile" accept=".pdf" id="cvFile">
            <span class="file-input-button">Choose File</span>
            <span class="file-name" id="cvFileName">No file chosen</span>
          </div>
        </div>

        <div class="file-input-wrapper">
          <label>Motivation Letter (PDF):</label>
          <div class="custom-file-input">
            <input required type="file" name="motivationFile" accept=".pdf" id="motivationFile">
            <span class="file-input-button">Choose File</span>
            <span class="file-name" id="motivationFileName">No file chosen</span>
          </div>
        </div>

      </div>

      <div class="button-group">
          <button type="submit">Confirm Application</button>
          <a href="/student/internships" class="cancel">Cancel</a>
        </div>
    </form>
  </div>

</div>

<script>
  document.getElementById("cvFile").addEventListener("change", function () {
    const fileNameSpan = document.getElementById("cvFileName");
    fileNameSpan.textContent = this.files.length > 0
            ? this.files[0].name
            : "No file chosen";
  });

  document.getElementById("motivationFile").addEventListener("change", function () {
    const fileNameSpan = document.getElementById("motivationFileName");
    fileNameSpan.textContent = this.files.length > 0
            ? this.files[0].name
            : "No file chosen";
  });
</script>

</body>
</html>

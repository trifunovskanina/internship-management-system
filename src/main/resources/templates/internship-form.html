<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Apply for Internship')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="card card-form">

    <h1 th:text="${internship.title}"></h1>

    <div class="section">
        <span class="label">Description</span>
        <p th:text="${internship.description}"></p>
    </div>

    <div class="section">
        <span class="label">Company</span>
        <p th:text="${internship.company.name}"></p>
    </div>

    <div class="section">
        <span class="label">Duration</span>
        <p>
            <span th:text="${internship.durationWeeks}"></span> weeks
        </p>
    </div>

    <div class="section">
        <span class="label">Supporting Documents</span>

        <form th:action="@{/student/internships/{id}(id=${internship.id})}"
              method="post"
              enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="file-grid">
                <div class="file-input-wrapper">
                    <label for="cvFile">CV (PDF):</label>
                    <div class="custom-file-input">
                        <input required type="file" name="cvFile" accept=".pdf" id="cvFile">
                        <span class="file-input-button">Choose File</span>
                        <span class="file-name">No file chosen</span>
                    </div>
                </div>

                <div class="file-input-wrapper">
                    <label for="motivationFile">Motivation Letter (PDF):</label>
                    <div class="custom-file-input">
                        <input required type="file" name="motivationFile" accept=".pdf" id="motivationFile">
                        <span class="file-input-button">Choose File</span>
                        <span class="file-name">No file chosen</span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">Confirm Application</button>
            <a href="/student/internships" class="cancel">Cancel</a>
        </form>
    </div>

</div>

<script th:src="@{/js/file-input.js}"></script>

</body>
</html>

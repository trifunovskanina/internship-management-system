<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Admin – User Management')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>User Accounts</h1>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Username</th>
                <th>Name</th>
                <th>Role</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.username}"></td>
                <td th:text="${user.person.firstName + ' ' + user.person.lastName}"></td>

                <td>
                    <form th:if="${user.role.name() != 'ADMIN'}"
                          th:action="@{/admin/users/{id}/role(id=${user.id})}"
                          class="role-form"
                          method="post">
                        <select name="role" class="role-select">
                            <option th:each="role : ${roles}"
                                    th:value="${role}"
                                    th:text="${role.name()}"
                                    th:selected="${role == user.role}"></option>
                        </select>

                        <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    </form>

                    <span th:if="${user.role.name() == 'ADMIN'}" class="badge badge-admin">ADMIN</span>
                </td>

                <td>
                    <span th:if="${user.enabled}" class="status-enabled">ENABLED</span>
                    <span th:if="${!user.enabled}" class="status-disabled">DISABLED</span>
                </td>

                <td>
                    <form th:if="${user.role.name() != 'ADMIN'}"
                          th:action="@{/admin/users/{id}/toggle(id=${user.id})}"
                          method="post">
                        <button type="submit"
                                class="btn btn-primary btn-sm"
                                th:text="${user.enabled ? 'Disable' : 'Enable'}"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

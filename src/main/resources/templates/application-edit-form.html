<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Apply for Internship')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="card card-form">

    <h2>Edit Application Status</h2>

    <p>
        <strong>Student:</strong>
        <span th:text="${person.firstName}"></span>
        <span th:text="${person.lastName}"></span>
    </p>

    <p>
        <strong>Faculty:</strong>
        <span th:text="${program.faculty.name}"></span>
    </p>

    <p>
        <strong>Study Program:</strong>
        <span th:text="${program.name}"></span>
    </p>

    <p>
        <strong>Company:</strong>
        <span th:text="${internship.company.name}"></span>
    </p>

    <p>
        <strong>Internship:</strong>
        <span th:text="${internship.title}"></span>
    </p>

    <div class="section">
        <span class="label">Submitted Documents</span>

        <div th:if="${#lists.isEmpty(documents)}">
            <em>No documents submitted.</em>
        </div>

        <div th:if="${!#lists.isEmpty(documents)}" class="documents">
            <div class="document-row" th:each="document : ${documents}">
                <span class="doc-type" th:text="${document.type}"></span>
                <span class="doc-name" th:text="${document.filePath}"></span>
            </div>
        </div>
    </div>

    <form th:action="@{/company-mentor/supervise/edit}"
          th:object="${application}"
          method="post">
        <input type="hidden" name="applicationId" th:field="*{id}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label class="label" for="status">Status</label>
        <select class="form-select" id="status" name="status">
            <option th:each="status : ${statuses}"
                    th:value="${status.name()}"
                    th:text="${status.name()}"
                    th:selected="${status == application.status}"></option>
        </select>

        <button type="submit" class="btn btn-primary btn-lg">Save</button>
        <a class="cancel" th:href="@{/company-mentor/internships/{id}/applications(id=${internship.id})}">Cancel</a>
    </form>

</div>

</body>
</html>

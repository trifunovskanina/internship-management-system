<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Internship Management System')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1 th:text="'Applications for ' + ${internship.title}"></h1>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Student</th>
                <th>Index</th>
                <th>Applied On</th>
                <th>Status</th>
                <th th:if="${isOwner}" sec:authorize="hasRole('COMPANY_MENTOR')">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="app : ${applications}">
                <td th:text="${app.student.person.firstName + ' ' + app.student.person.lastName}"></td>
                <td th:text="${app.student.indexNumber}"></td>
                <td th:text="${app.applicationDate}"></td>
                <td>
                    <span class="badge"
                          th:classappend="'status-' + ${app.status}"
                          th:text="${app.status}"></span>
                </td>
                <td th:if="${isOwner}" sec:authorize="hasRole('COMPANY_MENTOR')">
                    <a class="table-link"
                       th:href="@{/company-mentor/supervise/edit/{id}(id=${app.id})}">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

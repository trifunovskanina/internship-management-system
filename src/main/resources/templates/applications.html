<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Internship Management System')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Applications</h1>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Internship</th>
                <th>Company</th>
                <th>Applied On</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="app : ${applications}">
                <td th:text="${app.internship.title}"></td>
                <td th:text="${app.internship.company.name}"></td>
                <td th:text="${app.applicationDate}"></td>
                <td>
                    <span class="badge"
                          th:classappend="'status-' + ${app.status}"
                          th:text="${app.status}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
